spring:
  application:
    name: hongik-grad
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the source of truth; do not flip to validate/update
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # PR-01 only: allow boot without DB until PR-02 wires Flyway
      initialization-fail-timeout: -1
      # Keep the pool small so multiple local instances and tools can share one Postgres.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

dart:
  api:
    key: ${DART_API_KEY:}
  poller:
    enabled: ${DART_POLLER_ENABLED:true}

ml:
  api:
    # KOSPI excess-return model service (ML repo, boseong branch FastAPI).
    # Unset => the analysis tab serves available=false instead of a forecast.
    base-url: ${ML_API_BASE_URL:}
    key: ${ML_API_KEY:}

krx:
  api:
    base-url: ${KRX_API_BASE_URL:}
    key: ${KRX_API_KEY:}
    secret: ${KRX_API_SECRET:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hongik.grad: INFO

jwt:
  # 백엔드가 직접 토큰을 발급·검증한다. HS256 이므로 32자 이상이어야 한다.
  secret: ${JWT_SECRET:replace-me-with-a-random-32-byte-secret}
  access-token-ttl: ${JWT_ACCESS_TTL:PT1H}
  refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

themesense:
  artifacts-dir: ${THEMESENSE_ARTIFACTS_DIR:}
  stage1-version: ${THEMESENSE_STAGE1_VERSION:themesense-stage1-v1.0}
  stage2-version: ${THEMESENSE_STAGE2_VERSION:themesense-stage2-v1.0}
