spring:
  flyway:
    baseline-on-migrate: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# LOCAL DEV ONLY: a deterministic, non-placeholder HS256 secret so the app boots without
# any configuration. prod MUST inject a random secret via JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-32-bytes-minimum-xxxxxxxx}

logging:
  level:
    com.hongik.grad: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
