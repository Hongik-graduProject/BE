spring:
  config:
    import: "optional:file:./.env[.properties]"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: test-secret-32-bytes-minimum-aaaaaaaa

# 두 프로파일 모두 ./.env 를 불러오므로, 개발자 .env 의 실제 키로 외부 API 를 부르지 않게 비운다.
dart:
  api:
    key: ""
  poller:
    enabled: false

themesense:
  artifacts-dir: ""

logging:
  level:
    root: WARN
    com.hongik.grad: INFO
    org.flywaydb: INFO
