spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:h2:mem:lightweight;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

supabase:
  jwt-secret: test-secret-32-bytes-minimum-aaaaaaaa
  audience: authenticated

dart:
  poller:
    enabled: false

logging:
  level:
    root: WARN
    com.hongik.grad: INFO
