spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:h2:mem:lightweight;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: test-secret-32-bytes-minimum-aaaaaaaa

# 두 프로파일 모두 ./.env 를 불러오므로, 개발자 .env 의 실제 키로 외부 API 를 부르지 않게 비운다.
dart:
  api:
    key: ""
  poller:
    enabled: false

themesense:
  artifacts-dir: ""

logging:
  level:
    root: WARN
    com.hongik.grad: INFO
