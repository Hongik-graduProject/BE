plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.hongik.grad'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('testcontainersVersion', '1.21.3')
    set('jjwtVersion', '0.12.5')
    set('firebaseAdminVersion', '9.4.1')
    set('jsoupVersion', '1.18.1')
    set('springdocVersion', '2.6.0')
    set('postgresqlVersion', '42.7.4')
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB / Migration
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

    // JWT (Supabase JWT verification — issuance handled by Supabase)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Firebase Admin (FCM) — wired in PR-09
    implementation "com.google.firebase:firebase-admin:${firebaseAdminVersion}"

    // Jsoup (news crawler placeholder, v2)
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    // OpenAPI / Swagger UI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Docker Desktop on Engine 29+ requires API >= 1.44. docker-java 3.4.x still
    // defaults to v1.41 during negotiation, which the daemon rejects with HTTP 400
    // ("client version too old"). Force a supported version via system property —
    // docker-java reads `api.version` to override the default. See
    // https://github.com/docker-java/docker-java/blob/3.4.2/docker-java-core/src/main/java/com/github/dockerjava/core/RemoteApiVersion.java
    systemProperty 'api.version', '1.44'
    environment 'DOCKER_API_VERSION', '1.44'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0') // Google style, not AOSP
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('build') {
    dependsOn 'spotlessCheck'
}
